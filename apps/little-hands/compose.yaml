name: littlehands-production
x-app: &app
  image: littlehands:production
  build: .
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &app-env
    LH_ENV: production
    LH_ALLOWED_HOSTS: ${LH_ALLOWED_HOSTS:?Set exact allowed hosts}
    LH_SITE_URL: ${LH_SITE_URL:?Set HTTPS origin}
    LH_TRUST_PROXY: "1"
    LH_SECRET_KEY_FILE: /run/secrets/django_secret
    LH_DB_NAME: littlehands
    LH_DB_HOST: db
    LH_DB_PORT: "3306"
    LH_DB_USER: littlehands_runtime
    LH_DB_PASSWORD_FILE: /run/secrets/runtime_password
  secrets: [django_secret, runtime_password]
  depends_on:
    db:
      condition: service_healthy
  networks: [backend]
services:
  db:
    image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    command: [--log-bin-trust-function-creators=ON, --character-set-server=utf8mb4, --collation-server=utf8mb4_0900_as_cs]
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: littlehands
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_root_password, owner_password, runtime_password]
    volumes:
      - mysqldata:/var/lib/mysql
      - ./deploy/bootstrap.sh:/docker-entrypoint-initdb.d/10-littlehands.sh:ro
      - ./deploy/roles.sql:/opt/littlehands/roles.sql:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, --protocol=tcp, --host=127.0.0.1, --silent]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]
  web:
    <<: *app
    restart: unless-stopped
    ports: ["127.0.0.1:${LH_HTTP_PORT:-8870}:8000"]
    networks: [backend, ingress]
    healthcheck:
      test: [CMD, python, deploy/healthcheck.py]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  migrate:
    <<: *app
    profiles: [tools]
    environment:
      <<: *app-env
      LH_DB_USER: littlehands_owner
      LH_DB_PASSWORD_FILE: /run/secrets/owner_password
    secrets: [django_secret, owner_password]
    command: [python, manage.py, migrate, --noinput]
secrets:
  django_secret:
    file: ${LH_SECRETS_DIR:?Set absolute secret directory outside the checkout}/django_secret
  mysql_root_password:
    file: ${LH_SECRETS_DIR}/mysql_root_password
  owner_password:
    file: ${LH_SECRETS_DIR}/owner_password
  runtime_password:
    file: ${LH_SECRETS_DIR}/runtime_password
volumes:
  mysqldata:
networks:
  backend:
    internal: true
  ingress: {}
