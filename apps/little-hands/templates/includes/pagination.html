{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="목록 페이지">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}" data-action="previous-page" data-native-key="pagination-previous" data-native-type="control">← 이전</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 페이지</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}" data-action="next-page" data-native-key="pagination-next" data-native-type="control">다음 →</a>{% endif %}</nav>{% endif %}
