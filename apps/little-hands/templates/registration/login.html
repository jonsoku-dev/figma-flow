{% extends 'base.html' %}{% block title %}로그인 · 작은손 커피공방{% endblock %}{% block content %}<div class="auth"><p class="kicker" data-native-key="registration-login-p-1-{{ forloop.counter|default:'0' }}" data-native-type="text">다시 만나 반가워요</p><h1 data-native-key="login-title" data-native-type="text">작은손에 로그인</h1><p class="muted" data-native-key="registration-login-p-2-{{ forloop.counter|default:'0' }}" data-native-type="text">예약한 수업과 새로운 배움이 기다리고 있어요.</p><form class="paper" method="post" action="{% url 'login' %}" data-submit-feedback data-native-key="login-form" data-native-type="surface">{% csrf_token %}{% include 'includes/form.html' %}<input type="hidden" name="next" value="{{ next }}"><button class="button full" type="submit" data-action="login-submit" data-native-key="login-submit" data-native-type="control">로그인</button>{% include 'includes/busy.html' %}</form><p class="auth-footer" data-native-key="registration-login-p-3-{{ forloop.counter|default:'0' }}" data-native-type="text">처음 오셨나요? <a href="{% url 'signup' %}" data-action="signup" data-native-key="login-signup" data-native-type="control">회원 가입</a></p></div>{% endblock %}
