<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>/* FIGMA_FLOW_PANEL_CSS */
.task-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.task-info{flex:1;min-width:0}.task-title{font-size:14px;font-weight:650}.task-scope{margin-top:4px;font-size:11px;color:var(--muted)}
.task-kind{font-size:11px;color:var(--muted)}.task-row:last-child{border-bottom:0}.task-actions{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;flex-shrink:0}.task-actions button{white-space:nowrap}
@media(max-width:380px){.task-row{flex-direction:column;align-items:stretch;gap:8px}.task-actions{flex-wrap:wrap}}
</style></head><body class="panel">
<header class="masthead"><div class="brand"><span class="brand-mark" aria-hidden="true"></span>Figma Flow</div><span class="context">작업 목록</span></header>
<main class="workspace"><section class="intro"><h1>준비된 작업</h1></section>
<section class="status" id="home-status" data-state="ready" aria-live="polite"><h2 class="status-title" id="home-status-title">작업 목록을 불러오는 중</h2><p class="status-body" id="home-status-body">Codex에서 준비한 작업을 확인합니다.</p></section>
<div id="task-list" aria-label="프로젝트별 작업"></div>
</main>
<script>
const taskList = document.getElementById('task-list');
const statusPanel = document.getElementById('home-status');
const statusTitle = document.getElementById('home-status-title');
const statusBody = document.getElementById('home-status-body');
const kinds = {import:'가져오기', review:'방향 검토', discover:'현재 문서 읽기', sync:'그래프 동기화'};
let session = null;
function append(parent, tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (className) element.className = className;
  parent.appendChild(element); return element;
}
window.onmessage = event => {
  const message = event.data && event.data.pluginMessage;
  if (!message) return;
  if (message.type === 'workspace-error') {
    if (session && message.workspaceSession !== session) return;
    statusPanel.hidden = false; statusPanel.dataset.state = 'error';
    statusTitle.textContent = '작업을 열 수 없습니다'; statusBody.textContent = message.message;
    return;
  }
  if (message.type !== 'workspace-tasks') return;
  session = message.workspaceSession;
  taskList.replaceChildren();
  const tasks = message.tasks;
  const failed = typeof message.error === 'string' && !!message.error;
  statusPanel.hidden = tasks.length > 0 && !failed;
  statusPanel.dataset.state = failed ? 'error' : 'ready';
  if (failed) {
    statusTitle.textContent = '작업을 열 수 없습니다'; statusBody.textContent = message.error;
  } else if (!tasks.length) {
    statusTitle.textContent = '준비된 작업이 없습니다';
    statusBody.textContent = 'Codex에서 프로젝트의 Figma 작업을 준비한 뒤 플러그인을 다시 열어 주세요.';
    return;
  }
  const groups = new Map();
  for (const task of tasks) {
    const project = task.project || '프로젝트';
    if (!groups.has(project)) {
      const section = append(taskList, 'section', undefined, 'work-section');
      append(section, 'h2', project); groups.set(project, section);
    }
    const row = append(groups.get(project), 'div', undefined, 'task-row');
    const info = append(row, 'div', undefined, 'task-info');
    append(info, 'p', kinds[task.kind] || task.kind, 'task-kind');
    append(info, 'h3', task.title, 'task-title');
    const wrongFile = !!task.fileKey && task.fileKey !== message.fileKey;
    const scope = wrongFile ? '다른 파일에서 실행' : '현재 파일';
    const target = append(info, 'p', scope + (task.pageId ? ' · 지정 페이지' : ''), 'task-scope');
    target.title = [task.fileKey ? '파일 ' + task.fileKey : '', task.pageId ? '페이지 ' + task.pageId : ''].filter(Boolean).join(' / ');
    const actions = append(row, 'div', undefined, 'task-actions');
    const button = append(actions, 'button', wrongFile ? '다른 파일' : '열기', wrongFile ? 'secondary' : 'primary');
    button.type = 'button'; button.disabled = wrongFile;
    button.setAttribute('aria-label', task.title + (wrongFile ? ' · 지정 파일에서 열어야 합니다' : ' 열기'));
    button.onclick = () => parent.postMessage({pluginMessage:{type:'workspace-open',workspaceSession:session,key:task.key}}, '*');
    const chat = append(actions, 'button', task.threadId ? 'Codex 연결' : '대화 미연결', 'secondary');
    chat.type = 'button'; chat.disabled = wrongFile || !task.threadId;
    chat.setAttribute('aria-label', task.title + ' Codex 연결');
    chat.onclick = () => parent.postMessage({pluginMessage:{type:'workspace-chat-open',workspaceSession:session,key:task.key}}, '*');
  }
};
taskList.addEventListener('keydown', event => {
  if (!['ArrowDown','ArrowUp','Home','End'].includes(event.key)) return;
  const buttons = [...taskList.querySelectorAll('button:not(:disabled)')];
  const index = buttons.indexOf(document.activeElement);
  if (!buttons.length || index < 0) return;
  const next = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 :
    (index + (event.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length;
  event.preventDefault(); buttons[next].focus();
});
parent.postMessage({pluginMessage:{type:'workspace-home-ready'}}, '*');
</script></body></html>
