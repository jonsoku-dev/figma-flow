<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>로컬 디자인 가져오기</title>
<style>
body{font:13px/1.5 Inter,system-ui,sans-serif;margin:20px;color:var(--figma-color-text,#202124);background:var(--figma-color-bg,#fff)}
h1{font-size:18px;margin:0 0 8px}p{margin:8px 0 16px}button{font:inherit;padding:9px 12px;margin:6px 6px 8px 0;border:1px solid #888;border-radius:6px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}label{display:block;margin:14px 0}input{margin-right:6px}#status{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #aaa;padding-top:12px}textarea{width:100%;height:80px;box-sizing:border-box;font:11px monospace}
iframe{display:block;width:100%;height:440px;border:1px solid #aaa;margin-top:10px;box-sizing:border-box}#preview{margin-top:16px}
</style>
<h1>로컬 디자인 가져오기</h1>
<p>로컬 디자인에서 화면, 컴포넌트, 변수와 클릭 연결을 만듭니다. 같은 디자인을 다시 열면 기존 페이지로 이동합니다.</p>
<label><input id="fresh" type="checkbox">새 페이지와 변수 컬렉션으로 추가하기 (기존 가져오기 보존)</label>
<button id="import" disabled>디자인 가져오기 · 기존 페이지 열기</button>
<button id="export" disabled>현재 디자인 읽기</button>
<button id="sync" hidden disabled>앱에 반영</button>
<p>지원되는 노드에는 주석을 붙이고, 나머지는 플러그인 데이터에 기록합니다. 현재 레이어와 변수, 프로토타입을 JSON으로 저장할 수 있습니다.</p>
<button id="save" disabled>읽은 결과 JSON 저장</button>
<textarea id="json" readonly aria-label="현재 디자인의 JSON" placeholder="현재 디자인을 읽은 뒤 저장하세요. 여기서 JSON을 복사할 수도 있습니다."></textarea>
<div id="status" role="status" aria-live="polite">Figma 연결을 기다리는 중입니다.</div>
<section id="preview" hidden><a id="preview-link" target="_blank" rel="noopener noreferrer">반영된 앱과 실제 화면 비교를 크게 열기</a><iframe id="preview-frame" title="반영된 앱과 실제 화면 비교" referrerpolicy="no-referrer"></iframe></section>
<script>
let readback = "";
const byId = id => document.getElementById(id);
const clearPreview = () => { byId("preview").hidden = true; byId("preview-frame").src = "about:blank"; byId("preview-link").href = ""; };
const sessionNonce = Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");
const send = message => parent.postMessage({ pluginMessage: { ...message, session_nonce: sessionNonce } }, "*");
for (const type of ["import", "export", "sync"]) byId(type).onclick = () => {
  if (type === "sync") { byId("sync").disabled = true; byId("status").textContent = "현재 Figma 페이지를 읽고 있습니다…"; }
  send({ type, fresh: byId("fresh").checked });
};
byId("save").onclick = () => {
  const url = URL.createObjectURL(new Blob([readback], { type: "application/json" }));
  const link = document.createElement("a"); link.href = url; link.download = "figma-flow-readback.json";
  document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};
const connectionTimeout = setTimeout(() => { byId("status").textContent = "Error: Figma 연결 응답이 없습니다. 플러그인을 닫고 다시 실행하세요."; }, 5000);
window.onmessage = event => {
  const message = event.data && event.data.pluginMessage;
  if (!message || message.session_nonce !== sessionNonce) return;
  if (message.type === "status") {
    if (message.ready === true) { clearTimeout(connectionTimeout); byId("import").disabled = false; byId("export").disabled = false; byId("sync").hidden = message.paired !== true; byId("sync").disabled = false; }
    byId("status").textContent = message.message + (message.warnings?.length ? "\n" + message.warnings.join("\n") : "");
    if (message.message.startsWith("Error:")) clearPreview();
  }
  if (message.type === "busy") {
    for (const id of ["import", "export", "sync"]) byId(id).disabled = message.value;
    if (message.value && message.operation === "sync") clearPreview();
  }
  if (message.type === "sync-result") {
    const result = message.result;
    const items = value => Array.isArray(value) ? value.join(", ") || "없음" : String(value ?? "없음");
    const count = value => Array.isArray(value) ? value.length : value ?? 0;
    byId("status").textContent = `${({ baseline: "기준선 저장", applied: "앱 반영 완료", unchanged: "변경 없음" })[result.status]}\n변경 토큰 ${count(result.changed_tokens)}개 · 화면 ${count(result.screens)}개 · 코드 ${count(result.code_ids)}개\n화면: ${items(result.screens)}\n코드: ${items(result.code_ids)}\n파일: ${items(result.files)}\n보고서: ${items(result.report)}`;
    if (result.preview_error) { clearPreview(); byId("status").textContent += `\n미리보기 오류: ${result.preview_error}`; }
  }
  if (message.type === "preview" && /^http:\/\/localhost:\d+\/$/.test(message.url)) {
    byId("preview-frame").src = message.url;
    byId("preview-link").href = message.url;
    byId("preview").hidden = false;
  }
  if (message.type === "readback") { readback = JSON.stringify(message.data, null, 2); byId("json").value = readback; byId("save").disabled = false; }
};
send({ type: "ready" });
</script></html>
