<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>디자인 미리보기</title><style>:root {
  --color-brand: var(--palette-blue);
  --color-onBrand: var(--palette-white);
  --color-surface: var(--palette-pale);
  --color-text: var(--palette-ink);
  --font-body: Arial;
  --font-size: 16px;
  --opacity-full: 1;
  --palette-blue: #425cc7;
  --palette-ink: #20263a;
  --palette-pale: #eef1ff;
  --palette-white: #ffffff;
  --space-card: 16px;
  --space-round: 12px;
}
body{margin:0;padding:16px;background:#eef0f2;color:#20242a;font-family:system-ui,sans-serif}main{display:flex;flex-wrap:wrap;gap:24px}section{box-sizing:border-box;width:min(360px,100%);min-height:480px;background:white;padding:24px;border:1px solid #cdd2d8}small{color:#59616b;overflow-wrap:anywhere}h2{margin:20px 0 12px}p{line-height:1.5}.component{overflow-wrap:anywhere;display:block;box-sizing:border-box;width:100%;margin:12px 0;border:1px solid #999;font:inherit;text-align:left}a.component{text-decoration:none}a.component:hover{text-decoration:underline}a.component:focus-visible{outline:3px solid #1849a5}
.card--default { background: var(--color-surface); border-color: var(--color-surface); border-radius: var(--space-round); color: var(--color-text); padding: var(--space-card); }
.button--primary { background: var(--color-brand); border-color: var(--color-brand); border-radius: var(--space-round); color: var(--color-onBrand); padding: var(--space-card); }
.button--secondary { background: var(--color-surface); border-color: var(--color-brand); border-radius: var(--space-round); color: var(--color-text); padding: var(--space-card); }
.search--default { background: var(--color-onBrand); border-color: var(--color-brand); border-radius: var(--space-round); color: var(--color-text); padding: var(--space-card); }
</style></head><body><h1>스타일 시안</h1><main><section id="SCR-CARDS-LIST" aria-label="오늘의 복습 카드"><small>SCR-CARDS-LIST</small><h2>오늘의 복습 카드</h2><p>오늘의 카드 4 · 0 / 4</p><div class="component search--default">카드 제목으로 검색</div><a href="#SCR-CARDS-REVIEW" class="component card--default">시맨틱 HTML</a><a href="#SCR-CARDS-REVIEW" class="component card--default">Flexbox의 두 축</a><a href="#SCR-CARDS-REVIEW" class="component card--default">JavaScript 클로저</a><a href="#SCR-CARDS-REVIEW" class="component card--default">키보드 포커스</a></section><section id="SCR-CARDS-REVIEW" aria-label="카드 질문 및 정답"><small>SCR-CARDS-REVIEW</small><h2>질문 카드</h2><p>1 / 4</p><div class="component card--default">시맨틱 HTML을 사용하면 어떤 점이 좋아질까요?</div><div class="component button--primary">정답 보기</div></section></main></body></html>
