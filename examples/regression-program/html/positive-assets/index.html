<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한 잔에 머무는 시간 · Coffee Notes</title>
  <link rel="preload" as="font" type="font/woff2" href="fonts/Hahmlet.woff2?v=1" crossorigin>
  <link rel="stylesheet" href="page.css?v=1">
</head>
<body>
  <main id="app">
    <header><p class="brand" data-native="brand">Coffee Notes</p><p class="edition" data-native="edition">일상의 작은 기록</p></header>
    <article id="screen-coffee-read" class="story" aria-labelledby="read-title">
      <div class="intro"><p class="kicker" data-native="kicker">사진 에세이 · 느린 아침</p><h1 id="read-title" data-native="title">한 잔에<br>머무는 시간</h1></div>
      <figure><img data-native="photo" src="coffee.jpg?v=1#photo" width="1600" height="900" alt="붉은 테이블 위에 놓인 하얀 커피잔을 위에서 바라본 사진"><figcaption data-native="caption">사진: Pixel.la · CC0</figcaption></figure>
      <p class="body" data-native="body">아침의 속도를 잠시 늦춥니다.<br>따뜻한 한 잔과 함께, 오늘의 문장을 골라 보세요.</p>
      <div class="actions"><button id="coffee-open" data-variant="Primary">사진과 서체 살펴보기</button></div>
    </article>
    <article id="screen-coffee-credits" class="credits" aria-labelledby="credits-title" hidden>
      <p class="kicker" data-native="kicker">사진과 서체</p><h1 id="credits-title" data-native="title">사진이 전하는 온도</h1>
      <img data-native="photo" src="coffee.jpg?v=1#credits" width="1600" height="900" alt="붉은 테이블 위의 커피잔 사진 전체">
      <p class="body" data-native="body">사진은 Pixel.la의 공개 사진을 사용했습니다.<br>문장은 Hahmlet의 한글 명조로 읽힙니다.</p>
      <p class="caption" data-native="caption">Coffee cup seen from above · CC0 / Hahmlet · OFL 1.1</p>
      <button id="coffee-back" data-variant="Return">에세이로 돌아가기</button>
    </article>
  </main>
  <script src="app.js?v=1"></script>
</body>
</html>
