name: Diagnose macOS control readiness
on:
  push:
    branches: [diagnose/macos-readiness-1.1.1]
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5080a2b2738fdf5b6300a04b90304cd8f3c0b82a
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Check the candidate and original failing CLI tests on hosted macOS
        run: |
          test "$(git rev-parse HEAD)" = 5080a2b2738fdf5b6300a04b90304cd8f3c0b82a
          python -B tools/test_env.py python -B -m unittest -v tests.test_control_loopback_startup tests.test_registry_intent
          python -B tools/test_env.py python -B -m unittest discover -s tests -p test_figma_control.py
