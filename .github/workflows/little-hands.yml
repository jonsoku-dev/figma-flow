# Generated from library/delivery/little-hands.yml.in and library/delivery/graph.json.
name: Little Hands production app
on:
  push:
    branches: [main]
    paths: ['apps/little-hands/**', '.github/workflows/little-hands.yml']
  pull_request:
    paths: ['apps/little-hands/**', '.github/workflows/little-hands.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_DATABASE: littlehands
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: disposable-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: apps/little-hands
    env:
      LH_ENV: staging
      LH_SECRET_KEY: ci-only-disposable-key-which-is-never-used-for-production-2026
      LH_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      LH_SITE_URL: http://localhost:8000
      LH_DB_HOST: 127.0.0.1
      LH_DB_PORT: '3306'
      LH_DB_NAME: littlehands
      LH_DB_USER: root
      LH_DB_PASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev
          python -m pip install --require-hashes --only-binary=:all: --no-binary=mysqlclient -r requirements.lock
      - run: python -B manage.py check
      - run: python -B manage.py makemigrations --check --dry-run
      - run: python -B manage.py test booking.tests config.tests --verbosity 1
      - run: python -B -m unittest discover -s tests
      - name: Build the production image on amd64
        run: docker build --tag littlehands:ci .
