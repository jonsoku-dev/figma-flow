name: Little Hands production app
on:
  push:
    branches: [main]
    paths: ['apps/little-hands/**', '.github/workflows/little-hands.yml']
  pull_request:
    paths: ['apps/little-hands/**', '.github/workflows/little-hands.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_DB: littlehands
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d littlehands"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: apps/little-hands
    env:
      LH_ENV: staging
      LH_SECRET_KEY: ci-only-disposable-key-which-is-never-used-for-production-2026
      LH_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      LH_SITE_URL: http://localhost:8000
      DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/littlehands
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -B manage.py check
      - run: python -B manage.py makemigrations --check --dry-run
      - run: python -B manage.py test booking.tests config.tests --verbosity 1
      - run: python -B -m unittest discover -s tests
      - name: Build the production image on amd64
        run: docker build --tag littlehands:ci .
