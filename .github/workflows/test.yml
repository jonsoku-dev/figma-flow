name: Test Figma Flow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install native Codex CLI for the OS sandbox tests
        working-directory: ${{ runner.temp }}
        run: |
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin; digest=78ea9c178d2dc8fde71d6494df3b9eab902fd6d6de0a84e65234220d93bb6144 ;;
            x86_64) target=x86_64-apple-darwin; digest=f46451741936ebdf5201b8becd0820a41be2a01d271b98703e0d9a1670c99993 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 --output codex.tar.gz "https://github.com/openai/codex/releases/download/rust-v0.165.0/codex-${target}.tar.gz"
          echo "${digest}  codex.tar.gz" > codex.sha256
          shasum -a 256 -c codex.sha256
          mkdir figma-flow-cli
          tar -xzf codex.tar.gz -C figma-flow-cli
          mv "figma-flow-cli/codex-${target}" figma-flow-cli/codex
          echo "$RUNNER_TEMP/figma-flow-cli" >> "$GITHUB_PATH"
      - name: Check read-only sandbox
        run: codex sandbox -P :read-only -C "$GITHUB_WORKSPACE" -- node --version
      - run: python -m pip install -r requirements-optional.txt
      - name: Verify pinned public API sources and local examples
        run: |
          npm install --prefix "$RUNNER_TEMP/figma-api-tools" --ignore-scripts --no-package-lock --no-audit --no-fund typescript@5.9.3
          python -m pip install -r library/figma-rest/requirements.txt
          parser="$RUNNER_TEMP/figma-api-tools/node_modules/typescript/lib/typescript.js"
          compiler="$RUNNER_TEMP/figma-api-tools/node_modules/typescript/lib/tsc.js"
          python -B tools/figma_rest_inventory.py verify
          python -B tools/figma_api_inventory.py verify --typescript "$parser"
          python -B tools/figma_api_inventory.py coverage --check-baseline --typescript "$parser"
          python -B tools/workspace_recipes.py verify-helpers
          python -B library/figma-recipes/build.py --typescript "$compiler"
          git diff --exit-code -- library/figma-recipes
          echo "FIGMA_API_TYPESCRIPT=$parser" >> "$GITHUB_ENV"
          echo "FIGMA_SDK_TEST_TYPESCRIPT=$compiler" >> "$GITHUB_ENV"
      - name: Build isolated Widget API project and verify recipe rollback
        run: |
          widget_dir="$RUNNER_TEMP/figma-flow-widget"
          python -B tools/figma_widget_project.py init "$widget_dir"
          python -B tools/figma_widget_project.py check "$widget_dir" --typescript "$FIGMA_SDK_TEST_TYPESCRIPT"
          python -B tools/figma_widget_project.py build "$widget_dir" --typescript "$FIGMA_SDK_TEST_TYPESCRIPT"
          node library/figma-recipes/test-rollback.cjs
      - name: Rebuild offline React panels
        run: |
          npm --prefix panel-ui install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm --prefix panel-ui run build
          git diff --exit-code -- figma-bridge/assets
      - name: Rebuild typed regression components
        run: |
          node examples/regression-program/design-system/build.mjs
          git diff --exit-code -- examples/regression-program/design-system/runtime.js
      - name: Verify the production app design adapter
        run: |
          python -B apps/little-hands/design/prepare_fonts.py
          python -B -m unittest discover -s apps/little-hands/design -p 'test_*.py'
      - run: python -B -m unittest discover -s tests
      - run: python -B -m unittest discover -s tests -p 'finalize_*.py'
      - run: node --test tests/*.cjs
      - run: python -B -m unittest discover -s examples/native-direction-review -p test_demo.py
